# Second worker: Claude Code in GitHub Actions (anthropics/claude-code-action).
#
# It starts only for the repository owner (arielkonopka):
#   - the label "claude-task" put on an issue, or
#   - a comment with "@claude" on an issue or PR (e.g. a review fix).
# It skips issues labelled "claimed:local" (the local agent has them) and
# marks the ones it takes "claimed:cloud".  Coordination rules:
# docs/spec/next-tasks.md, "Two workers".  Its own instructions:
# .github/claude-worker.md.
#
# Secrets (the user adds them; never in the repo): ANTHROPIC_API_KEY, or
# CLAUDE_CODE_OAUTH_TOKEN (a Pro/Max subscription, `claude setup-token`).
# Optional repository variable CLAUDE_MODEL (default claude-opus-5-5).
# Big tasks take 100+ turns: the worker commits and pushes after each
# finished step (claude-worker.md), so a cut-off run keeps its work;
# continue it with "@claude continue" on a PR from that branch.
name: claude-worker

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write        # the Claude GitHub App's token (OIDC)
  actions: read          # read CI results of its PRs

concurrency:
  group: claude-worker-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  work:
    if: >-
      github.actor == 'arielkonopka' &&
      ((github.event_name == 'issues' &&
        github.event.label.name == 'claude-task' &&
        !contains(github.event.issue.labels.*.name, 'claimed:local')) ||
       (github.event_name != 'issues' &&
        github.event.comment.user.login == 'arielkonopka' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.issue.labels.*.name, 'claimed:local')))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tools/gzbuild.py: git describe --tags

      - uses: ./.github/actions/toolchain

      - name: Claim the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
        run: |
          gh label create claimed:cloud --color 5319e7 \
            --description "Taken by the GitHub Actions worker" 2>/dev/null || true
          gh issue edit "$N" --add-label claimed:cloud

      # An issue labelled claude-task: a custom prompt; track_progress keeps
      # tag mode (progress comment, own branch).
      - name: Claude (issue task)
        if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-task
          track_progress: true
          show_full_output: true   # private repo: errors visible in the job log
          additional_permissions: |
            actions: read
          prompt: |
            You are the second worker on Galtzagorriak MINIX (MINIX 2.0.0 for the
            Flipper Zero). First read .github/claude-worker.md and follow it.
            Your task is issue #${{ github.event.issue.number }} of this repository.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 400
            --allowedTools "Bash(make:*),Bash(python3 -I tools/*),Bash(arm-none-eabi-size:*)"

      # "@claude ..." from the user on an issue or PR: plain tag mode.
      - name: Claude (comment)
        if: github.event_name != 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns 400
            --allowedTools "Bash(make:*),Bash(python3 -I tools/*),Bash(arm-none-eabi-size:*)"
            --append-system-prompt "You work on Galtzagorriak MINIX. Before anything else read .github/claude-worker.md and follow it."
