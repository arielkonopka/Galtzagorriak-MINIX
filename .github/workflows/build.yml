# Build the Flipper images, check the RAM budget and run the M2 self-test
# in QEMU.  Every push and PR gets the images as a workflow artifact; a
# tag vX.Y.Z also attaches them to the GitHub release of that tag.
# The user manual (docs/manual/install.md) says where to download them.
#
# Hard gates (a red check blocks the merge):
#   ramcheck    static RAM of every image <= flipper/ram-budget.txt
#   sizecheck   flash size of each big program <= flipper/size-budget.txt
#   flashcheck  flash pages erased in the M2 run <= flipper/flash-budget.txt
#   M2          the QEMU self-test passes
#   latbuild    the latency trace build (spec R0.8e, make latcheck) compiles
#   powercut    power cuts during installs (AC2b.5, tools/powercut.py)
# L1-L10 themselves need the device: QEMU's timing is not the Flipper's.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flipper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tools/gzbuild.py: git describe --tags

      - uses: ./.github/actions/toolchain

      - name: Build the Flipper images
        run: make BOARD=flipper -j"$(nproc)" minix card base-flash base pkgs

      - name: Security tests on the PC (tests/host, docs/security)
        run: make -C tests/host

      - name: RAM budget and version check
        run: make BOARD=flipper ramcheck

      - name: Flash size of the programs (size-budget.txt)
        run: make BOARD=flipper sizecheck

      - name: QEMU self-test (M2)
        run: |
          make -j"$(nproc)" INIT=m2 minix disk
          make INIT=m2 minix-run | tee m2.log
          grep -q 'M2 USER PASS' m2.log
          # console ONLCR: CR NL in cooked output, bare NL with OPOST off
          grep -q $'^M2 USER PASS\r$' m2.log
          grep -qx 'M2 RAW NL' m2.log

      - name: Flash erase budget (M2)
        run: python3 -I tools/flashcheck.py flash-budget.txt m2 m2.log

      - name: Latency trace build compiles (R0.8e)
        run: make BOARD=flipper -j"$(nproc)" latcheck

      - name: Collect the images
        run: |
          mkdir -p ../out
          cp build/flipper/minix/minix-base.bin build/flipper/minix/minix.bin \
             build/flipper/minix/card.img build/flipper/minix/pkgs/*.tar ../out/
          cd ../out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: galtzagorriak-flipper-${{ github.sha }}
          path: out/
          retention-days: 30

  # AC2b.5: every erase and the edges of every write of two installs are
  # cut, in both modes (52 QEMU boots, about a minute on 4 cores).
  powercut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flipper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Build for QEMU
        run: make -j"$(nproc)" minix disk
      - name: Power cuts during installs
        run: python3 -I tools/powercut.py -j"$(nproc)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, powercut]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: galtzagorriak-flipper-${{ github.sha }}
          path: out
      - name: Attach the images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "See CHANGELOG.md."
          gh release upload "$TAG" out/* --clobber

  # RS.18: the signed update file Galtzagorriak-X.Y.Z.update + .sha512.
  # GZ_UPDATE_KEY lives in the environment `release` (the user approves
  # each tag run); without it the job says so and attaches nothing.
  release-update:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flipper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Version and epoch (RS.19)
        run: make versioncheck
      - name: Build, sign and check the update file
        id: upd
        env:
          GZ_UPDATE_KEY: ${{ secrets.GZ_UPDATE_KEY }}
        run: |
          if [ -z "$GZ_UPDATE_KEY" ]; then
            echo "::warning::GZ_UPDATE_KEY is not set in the environment" \
                 "'release': no update file for this release (see" \
                 "docs/devguide/release-update-job.md)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f keys/release.pub || {
            echo "::error::flipper/keys/release.pub missing: commit the public key first"
            exit 1; }
          make BOARD=flipper -j"$(nproc)" minix card base-flash base pkgs
          make BOARD=flipper update
          v=$(sed -n 's/^#define GZ_RELEASE[^"]*"\(.*\)"/\1/p' \
                ../include/minix/gzversion.h)
          mkdir -p ../upd
          cp build/flipper/minix/Galtzagorriak.update \
             ../upd/Galtzagorriak-$v.update
          cd ../upd && sha512sum Galtzagorriak-$v.update \
             > Galtzagorriak-$v.update.sha512 && cat *.sha512
      - name: Attach to the release
        if: steps.upd.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" ../upd/* --clobber
