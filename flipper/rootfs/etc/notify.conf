# /etc/notify.conf - how notifications may get your attention (spec F.2).
# ~/.config/notify can change any of these for its user.
#	Volume: 0-100 (0: no sound; the speaker has no volume steps yet)
#	Vibro: yes | no
#	Led: yes | no
#	Dnd: HH:MM-HH:MM  do not disturb (local time), or off
# Alarms always ring as they are set; reminders and info wait out the
# do-not-disturb window (they are not shown then).
Volume: 80
Vibro: yes
Led: yes
Dnd: off
