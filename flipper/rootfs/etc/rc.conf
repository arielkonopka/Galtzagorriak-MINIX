# /etc/rc.conf - local settings for /etc/rc (sh variables).
# The default lives in /rom/etc/rc.conf; a copy in /etc on the SD card
# overrides it, and deleting that copy brings the default back.

# Run-time text cache: at most this many internal flash pages erased a
# day (R2b.11; 0: no run-time caching).
fcache_budget=32

# Swap to the SD card (/dev/hd3): off, plain (no encryption; set-uid
# programs and Secret: yes packages are never swapped) or crypt (needs swap
# encryption, not there yet: treated as off).  swap_reserve: KB of RAM the
# idle work keeps free by swapping out processes idle for 10 s (default 16,
# 0: only when a program cannot start).
swap=off
#swap_reserve=16

# fsck at boot (spec N.3, N.4): KB of memory for its maps; less memory
# means more passes over a large file system (/usr, /home).
fsck_mem=64
