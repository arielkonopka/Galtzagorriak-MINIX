# /etc/rc.conf - local settings for /etc/rc (sh variables).
# The default lives in /rom/etc/rc.conf; a copy in /etc on the SD card
# overrides it, and deleting that copy brings the default back.

# Run-time text cache: at most this many internal flash pages erased a
# day (R2b.11; 0: no run-time caching).
fcache_budget=32
