# The default settings image (/dev/rom, mounted read-only on /rom; spec
# L.2).  MINIX mkfs(1) format, built by tools/mkfsimg.py; make base-flash
# puts it into internal flash after the installed region's directories.
# Settings are read from the SD card first, then from here (cfopen, cfcat):
# deleting a file on the card brings its default back.  At most 32 KB.
boot
32 32
d--755 0 0
   etc d--755 0 0
      motd ---644 0 0 rootfs/etc/motd
      rc ---755 0 0 rootfs/etc/rc
      rc.conf ---644 0 0 rootfs/etc/rc.conf
      ttytab ---644 0 0 rootfs/etc/ttytab
      passwd ---644 0 0 rootfs/etc/passwd
      group ---644 0 0 rootfs/etc/group
      profile ---644 0 0 rootfs/etc/profile
      setup ---644 0 0 rootfs/etc/setup
      fsckrun ---644 0 0 rootfs/etc/fsckrun
      fsckboot ---644 0 0 rootfs/etc/fsckboot
      fstab ---644 0 0 rootfs/etc/fstab
      hostname.file ---644 0 0 rootfs/etc/hostname.file
      apps ---644 0 0 rootfs/etc/apps
      launcher.conf ---644 0 0 rootfs/etc/launcher.conf
   $
$
